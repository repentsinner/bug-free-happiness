name: security

# Supply-chain checks behind `quality / security` (§spec:supply-chain). An
# adopter calls this workflow and makes its `quality / security` summary job
# depend on the call.
on:
  workflow_call:
    inputs:
      path:
        description: Directory to check, relative to the repository root.
        type: string
        default: .

permissions:
  contents: read

jobs:
  dependabot-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails unless the Dependabot configuration covers github-actions and
      # the stack's package ecosystem, each at least weekly, with minor and
      # patch updates grouped. yq ships on the Ubuntu runner image; its
      # absence fails the job rather than skipping the checks.
      - name: Check the Dependabot configuration
        id: check
        env:
          CHECK_PATH: ${{ inputs.path }}
        run: |
          command -v yq
          root="${CHECK_PATH%/}"

          config=
          for name in dependabot.yml dependabot.yaml; do
            if [ -f "$root/.github/$name" ]; then
              config="$root/.github/$name"
              break
            fi
          done
          if [ -z "$config" ]; then
            echo "::error::$root/.github holds no Dependabot configuration (dependabot.yml)"
            exit 1
          fi
          if ! yq '.' "$config" > /dev/null; then
            echo "::error file=$config::$config does not parse as YAML"
            exit 1
          fi

          errors=0
          fail() {
            echo "::error file=$config::$1"
            errors=$((errors + 1))
          }

          [ "$(yq '.version' "$config")" = 2 ] || fail "version is not 2"

          # The stack's ecosystem comes from the manifests the repository
          # tracks, so build output and virtual environments do not count.
          # Listing first, outside the loop, lets a git failure fail the job.
          files=$(git -C "$root" ls-files --cached --others --exclude-standard)
          python=
          dart=
          while IFS= read -r file; do
            case "${file##*/}" in
              pyproject.toml | uv.lock | setup.py | Pipfile | requirements*.txt) python=1 ;;
              pubspec.yaml) dart=1 ;;
            esac
          done <<< "$files"

          ecosystems=$(yq '.updates // [] | .[] | ."package-ecosystem"' "$config")
          has() { grep -qxF -- "$1" <<< "$ecosystems"; }
          has github-actions || fail "no updates entry for package-ecosystem github-actions"
          if [ -n "$python" ] && ! has uv && ! has pip; then
            fail "Python manifests found, but no updates entry for package-ecosystem uv or pip"
          fi
          if [ -n "$dart" ] && ! has pub; then
            fail "pubspec.yaml found, but no updates entry for package-ecosystem pub"
          fi

          # A group without update-types takes every update type, so it
          # groups minor and patch updates too.
          count=$(yq '.updates // [] | length' "$config")
          for ((i = 0; i < count; i++)); do
            ecosystem=$(yq ".updates[$i].\"package-ecosystem\"" "$config")
            interval=$(yq ".updates[$i].schedule.interval // \"unscheduled\"" "$config")
            case "$interval" in
              daily | weekly) ;;
              *) fail "updates entry $ecosystem is $interval; schedule it daily or weekly" ;;
            esac
            grouped=$(yq ".updates[$i].groups // {} | to_entries | map(select(.value.\"update-types\" // [\"minor\", \"patch\"] | contains([\"minor\", \"patch\"]))) | length" "$config")
            [ "$grouped" -gt 0 ] || fail "updates entry $ecosystem has no group that takes minor and patch updates"
          done

          if [ "$errors" -gt 0 ]; then
            exit 1
          fi
          echo "$config conforms: $(tr '\n' ' ' <<< "$ecosystems")"

  pin-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails unless every external `uses:` under .github/workflows/ pins a
      # 40-character commit SHA followed by the release it is, as `# vX.Y.Z`
      # or a tag ending in it (`# notation--v0.2.16`). An Action listed,
      # unexpired, in .github/unreleased-actions.yml may carry
      # `# <branch> <YYYY-MM-DD>` instead. Local references are exempt. yq
      # ships on the Ubuntu runner image; its absence fails the job.
      - name: Check the pin shape of every Action reference
        id: check
        env:
          CHECK_PATH: ${{ inputs.path }}
        run: |
          command -v yq
          root="${CHECK_PATH%/}"
          today="$(date -u +%F)"
          errors=0
          fail() {
            echo "::error file=$1::$2"
            errors=$((errors + 1))
          }

          # Unexpired unreleased-Action entries, one owner/repo per line.
          listed=
          exceptions="$root/.github/unreleased-actions.yml"
          if [ -f "$exceptions" ]; then
            if ! yq '.' "$exceptions" > /dev/null; then
              echo "::error file=$exceptions::$exceptions does not parse as YAML"
              exit 1
            fi
            entries=$(yq -r '.[] | [.action, (.expires | tostring), (.reason // "")] | @tsv' "$exceptions")
            while IFS=$'\t' read -r action expires reason; do
              [ -n "$action" ] || continue
              if [ -z "$reason" ]; then
                fail "$exceptions" "$exceptions entry for $action gives no reason"
              elif [[ ! "$expires" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2} ]]; then
                fail "$exceptions" "$exceptions entry for $action has no expiry date"
              elif [[ "${expires:0:10}" < "$today" ]]; then
                fail "$exceptions" "$exceptions entry for $action expired on ${expires:0:10}; pin a release if upstream now has one, or renew the entry"
              else
                listed+="$action"$'\n'
              fi
            done <<< "$entries"
          fi

          release='^([A-Za-z0-9._-]*-)?v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'
          branch_date='^[A-Za-z0-9._/-]+ [0-9]{4}-[0-9]{2}-[0-9]{2}$'
          shopt -s nullglob
          files=("$root"/.github/workflows/*.yml "$root"/.github/workflows/*.yaml)
          for file in "${files[@]}"; do
            uses=$(grep -nE '^[[:space:]]*(-[[:space:]]*)?uses:' "$file" || true)
            while IFS=: read -r n line; do
              [ -n "$n" ] || continue
              value=$(sed -E 's/^[[:space:]]*(-[[:space:]]*)?uses:[[:space:]]*//' <<< "$line")
              ref=${value%%[[:space:]]*}
              ref=${ref//[\"\']/}
              comment=
              if [[ "$value" == *" # "* ]]; then
                comment=${value#* # }
                comment=${comment%"${comment##*[![:space:]]}"}
              fi
              [[ "$ref" == ./* ]] && continue
              action=$(cut -d/ -f1-2 <<< "${ref%@*}")
              sha=${ref##*@}
              if [[ "$ref" != *@* || ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
                fail "$file" "$file:$n: $ref is not pinned to a 40-character commit SHA"
              elif [[ "$comment" =~ $release ]]; then
                :
              elif [[ "$comment" =~ $branch_date ]]; then
                if ! grep -qxF -- "$action" <<< "$listed"; then
                  fail "$file" "$file:$n: $action is not listed in .github/unreleased-actions.yml, so its pin needs a # vX.Y.Z comment"
                fi
              else
                fail "$file" "$file:$n: $ref needs a # vX.Y.Z comment naming the release it pins"
              fi
            done <<< "$uses"
          done

          if [ "$errors" -gt 0 ]; then
            echo "$errors pin-shape error(s)"
            exit 1
          fi
          echo "pin shape conforms: ${#files[@]} workflow file(s)"
