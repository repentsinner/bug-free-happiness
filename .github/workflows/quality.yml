name: quality

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      derived_release_commit: ${{ steps.classify.outputs.derived_release_commit }}
      promotion_pr: ${{ steps.classify.outputs.promotion_pr }}
    steps:
      - id: classify
        uses: point-source/flywheel/classify@59758d1940ebe054ce9fdd4b7a7dc79a0cf235e0 # v2.1.0

  governance-lint:
    needs: classify
    if: needs.classify.outputs.derived_release_commit != 'true' && needs.classify.outputs.promotion_pr != 'true'
    uses: repentsinner/symphonize/.github/workflows/governance-lint.yml@1025d00f32bb7ffdfcddf0385be8e0935559b8c9 # notation--v0.2.12
    with:
      readme-type: library

  actionlint:
    needs: classify
    if: needs.classify.outputs.derived_release_commit != 'true' && needs.classify.outputs.promotion_pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Digest copied from the release's checksums file, so a replaced
      # release asset fails here rather than running.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -sfLo "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint

      # actionlint skips run: blocks silently when shellcheck is absent, so
      # its absence has to fail the job rather than pass it.
      - name: Lint workflows
        run: |
          command -v shellcheck
          "$RUNNER_TEMP/actionlint"

  # Summary jobs carry the required check names. Each runs whatever its
  # dependencies' outcome, because GitHub counts a skipped required check as
  # passing. classify is a dependency too: if it fails, the class jobs skip.
  governance:
    name: quality / governance
    needs: [classify, governance-lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a governance job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          exit 1

  correctness:
    name: quality / correctness
    needs: [classify, actionlint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a correctness job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          exit 1
