name: python-correctness

# Correctness checks for a uv project (§spec:stack-implementations): ruff
# lint and format, a type checker, and the project's tests. An adopter calls
# this workflow and makes its `quality / correctness` summary job depend on
# the call.
#
# ruff, pyright and mypy are pinned in this repository's
# .github/tools/python/pyproject.toml, a uv project the job reads from the
# workflow's own commit. A tool bump lands once here, proposed by Dependabot
# and gated by the self-test, and reaches every adopter through one SHA bump.
# pytest comes from the project's own lock, because the tests import the
# project's dependencies.
on:
  workflow_call:
    inputs:
      path:
        description: Directory of the uv project, relative to the repository root.
        type: string
        default: .
      type-checker:
        description: pyright (preferred) or mypy (deprecated, warns). none is transitional and warns.
        type: string
        default: pyright
      expect:
        description: >-
          Self-test only. pass, or the one step expected to fail: lint,
          format, types or tests. The job passes when every step matches.
        type: string
        default: pass
      app-client-id:
        description: >-
          Client ID of a GitHub App with Contents read access to the project's
          private git dependencies. With app-private-key, the job mints a
          read-only token and fetches github.com git dependencies over HTTPS
          with it, including ones declared as ssh:// URLs.
        type: string
        default: ""
    secrets:
      app-private-key:
        description: Private key of the app-client-id App.
        required: false

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tool pins live beside this workflow, so read them from the
      # commit the caller pinned. job.workflow_* names that commit;
      # github.sha would name the caller's. Fail rather than fall back, so
      # a missing context cannot quietly install other versions.
      - name: Resolve this workflow's commit
        id: self
        working-directory: .
        env:
          WF_REPO: ${{ job.workflow_repository }}
          WF_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WF_REPO" ] || [ -z "$WF_SHA" ]; then
            echo "::error::job.workflow_repository / job.workflow_sha are unavailable; cannot read the tool pins"
            exit 1
          fi
          echo "repository=$WF_REPO" >> "$GITHUB_OUTPUT"
          echo "sha=$WF_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out the tool pins
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.self.outputs.repository }}
          ref: ${{ steps.self.outputs.sha }}
          path: .python-correctness-tools
          sparse-checkout: .github/tools/python
          persist-credentials: false

      # Out of the checked-out tree before any tool walks it, then exported
      # for the steps below.
      - name: Read the tool pins
        working-directory: .
        run: |
          pins="$RUNNER_TEMP/python-tools.toml"
          mv .python-correctness-tools/.github/tools/python/pyproject.toml "$pins"
          rm -r .python-correctness-tools
          for tool in ruff pyright mypy; do
            version=$(sed -n "s/^ *\"${tool}==\([^\"]*\)\".*/\1/p" "$pins")
            if [ -z "$version" ]; then
              echo "::error::no ${tool}== pin in .github/tools/python/pyproject.toml"
              exit 1
            fi
            echo "${tool^^}_VERSION=$version" >> "$GITHUB_ENV"
          done

      # Private git dependencies: a token from the caller's App, read-only and
      # scoped to the repositories that App is installed on, minted per run.
      - name: Mint a token for private dependencies
        id: deps-token
        if: inputs.app-client-id != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      # Adopters declare these dependencies as https:// URLs, which Dependabot
      # can also fetch, so git adds the token to the owner's HTTPS URLs; uv
      # fetches through git. Other owners' URLs stay anonymous, since the
      # token reads only this owner's repositories. The SSH forms are mapped
      # too, for adopters that still declare ssh:// sources.
      - name: Route github.com git fetches through the token
        if: steps.deps-token.outputs.token != ''
        working-directory: .
        env:
          TOKEN: ${{ steps.deps-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          base="https://x-access-token:${TOKEN}@github.com/"
          git config --global url."$base$OWNER/".insteadOf "https://github.com/$OWNER/"
          git config --global --add url."$base".insteadOf "ssh://git@github.com/"
          git config --global --add url."$base".insteadOf "git@github.com:"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: ${{ inputs.path }}
          enable-cache: true

      # --locked fails when uv.lock no longer matches pyproject.toml, which is
      # a correctness failure in its own right, so it is not a checked step.
      - name: Install the locked environment
        run: uv sync --locked

      # Each check runs to completion so one failure does not hide another;
      # the verdict step below decides the job's result.
      - name: Lint
        id: lint
        continue-on-error: true
        run: uvx --from "ruff==${RUFF_VERSION}" ruff check .

      - name: Format
        id: format
        continue-on-error: true
        run: uvx --from "ruff==${RUFF_VERSION}" ruff format --check .

      - name: Type check
        id: types
        continue-on-error: true
        env:
          TYPE_CHECKER: ${{ inputs.type-checker }}
        run: |
          case "$TYPE_CHECKER" in
            pyright) uv run --with "pyright==${PYRIGHT_VERSION}" pyright ;;
            mypy)
              echo "::warning::mypy is deprecated here; migrate to pyright (§spec:stack-implementations)"
              uv run --with "mypy==${MYPY_VERSION}" mypy ;;
            none) echo "::warning::type checking is disabled; adopters run pyright (§spec:stack-implementations)" ;;
            *) echo "::error::type-checker must be pyright, mypy or none, not '$TYPE_CHECKER'"; exit 1 ;;
          esac

      - name: Test
        id: tests
        continue-on-error: true
        run: uv run pytest

      - name: Verdict
        env:
          EXPECT: ${{ inputs.expect }}
          LINT: ${{ steps.lint.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          TYPES: ${{ steps.types.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          case "$EXPECT" in
            pass | lint | format | types | tests) ;;
            *) echo "::error::expect must be pass, lint, format, types or tests, not '$EXPECT'"; exit 1 ;;
          esac
          mismatches=0
          for step in lint format types tests; do
            var="${step^^}"
            outcome="${!var}"
            want=success
            [ "$step" = "$EXPECT" ] && want=failure
            echo "$step: $outcome (expected $want)"
            [ "$outcome" = "$want" ] || mismatches=$((mismatches + 1))
          done
          [ "$mismatches" -eq 0 ]
