name: quality

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      derived_release_commit: ${{ steps.classify.outputs.derived_release_commit }}
      promotion_pr: ${{ steps.classify.outputs.promotion_pr }}
    steps:
      - id: classify
        uses: point-source/flywheel/classify@59758d1940ebe054ce9fdd4b7a7dc79a0cf235e0 # v2.1.0

  governance-lint:
    needs: classify
    if: needs.classify.outputs.derived_release_commit != 'true' && needs.classify.outputs.promotion_pr != 'true'
    uses: repentsinner/symphonize/.github/workflows/governance-lint.yml@1025d00f32bb7ffdfcddf0385be8e0935559b8c9 # notation--v0.2.12
    with:
      readme-type: library

  actionlint:
    needs: classify
    if: needs.classify.outputs.derived_release_commit != 'true' && needs.classify.outputs.promotion_pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Digest copied from the release's checksums file, so a replaced
      # release asset fails here rather than running.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -sfLo "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint

      # actionlint skips run: blocks silently when shellcheck is absent, so
      # its absence has to fail the job rather than pass it.
      - name: Lint workflows
        run: |
          command -v shellcheck
          "$RUNNER_TEMP/actionlint"

  # Self-test of security.yml. The call runs the workflow end to end on the
  # pass fixture. The fixtures job runs the check step's own script on every
  # fixture under tests/fixtures/dependabot/ and compares each outcome, so a
  # fixture that should fail does not leave a failed job on every PR.
  dependabot-config-call:
    needs: classify
    if: needs.classify.outputs.derived_release_commit != 'true' && needs.classify.outputs.promotion_pr != 'true'
    uses: ./.github/workflows/security.yml
    with:
      path: tests/fixtures/dependabot/pass

  dependabot-config-fixtures:
    needs: classify
    if: needs.classify.outputs.derived_release_commit != 'true' && needs.classify.outputs.promotion_pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Each fixture's output is indented before printing: a bare ::error
      # line would raise an annotation for a failure the test expects.
      - name: Check each fixture's outcome
        id: fixtures
        run: |
          check="$RUNNER_TEMP/check.sh"
          yq '.jobs.dependabot-config.steps[] | select(.id == "check") | .run' \
            .github/workflows/security.yml > "$check"
          [ "$(head -c 4 "$check")" != null ]

          mismatches=0
          expect() {
            local fixture=$1 want=$2 text=$3 out status=0
            out=$(CHECK_PATH="tests/fixtures/dependabot/$fixture" \
              bash --noprofile --norc -eo pipefail "$check" 2>&1) || status=1
            if [ "$status" = "$want" ] && grep -qF -- "$text" <<< "$out"; then
              echo "ok       $fixture"
            else
              echo "mismatch $fixture: exit $status, want $want and text '$text'"
              mismatches=$((mismatches + 1))
            fi
            mapfile -t lines <<< "$out"
            printf '    %s\n' "${lines[@]}"
          }

          expect pass 0 "conforms"
          expect missing-config 1 "no Dependabot configuration"
          expect missing-ecosystem 1 "package-ecosystem pub"
          expect infrequent 1 "is monthly"
          expect ungrouped 1 "minor and patch"
          [ "$mismatches" -eq 0 ]

  # Same harness for the pin-shape check: its step's own script against each
  # fixture under tests/fixtures/pin-shape/. The fixtures pin real Actions,
  # because the check reads their tags.
  pin-shape-fixtures:
    needs: classify
    if: needs.classify.outputs.derived_release_commit != 'true' && needs.classify.outputs.promotion_pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check each fixture's outcome
        id: fixtures
        run: |
          check="$RUNNER_TEMP/check.sh"
          yq '.jobs.pin-shape.steps[] | select(.id == "check") | .run' \
            .github/workflows/security.yml > "$check"
          [ "$(head -c 4 "$check")" != null ]

          mismatches=0
          expect() {
            local fixture=$1 want=$2 text=$3 out status=0
            out=$(CHECK_PATH="tests/fixtures/pin-shape/$fixture" \
              bash --noprofile --norc -eo pipefail "$check" 2>&1) || status=1
            if [ "$status" = "$want" ] && grep -qF -- "$text" <<< "$out"; then
              echo "ok       $fixture"
            else
              echo "mismatch $fixture: exit $status, want $want and text '$text'"
              mismatches=$((mismatches + 1))
            fi
            mapfile -t lines <<< "$out"
            printf '    %s\n' "${lines[@]}"
          }

          expect pass 0 "pin shape conforms"
          expect tag-ref 1 "ci.yml:7: actions/checkout@v4 is not pinned to a 40-character commit SHA"
          expect no-comment 1 "needs a comment naming the release at its commit: v7.0.1"
          expect less-specific 1 "names v7, but the most specific release at its commit is v7.0.1"
          expect stale 1 "names v5, but the tags at its commit are v7 v7.0.1"
          expect unlisted 1 "ublue-os/container-storage-action is not listed in .github/unreleased-actions.yml"
          expect expired 1 "entry for ublue-os/container-storage-action expired on 2000-01-01"
          expect unreadable 0 "could not read the tags of repentsinner/no-such-action-fixture"
          [ "$mismatches" -eq 0 ]

  # Self-test of python-correctness.yml: one call per fixture under
  # tests/fixtures/python/. Each failing fixture breaks exactly one check, and
  # `expect` names it, so every call passes when the workflow behaves and the
  # run carries no failed job.

  python-pass:
    needs: classify
    if: needs.classify.outputs.derived_release_commit != 'true' && needs.classify.outputs.promotion_pr != 'true'
    uses: ./.github/workflows/python-correctness.yml
    with:
      path: tests/fixtures/python/pass

  python-pass-mypy:
    needs: classify
    if: needs.classify.outputs.derived_release_commit != 'true' && needs.classify.outputs.promotion_pr != 'true'
    uses: ./.github/workflows/python-correctness.yml
    with:
      path: tests/fixtures/python/pass
      type-checker: mypy

  python-fail-lint:
    needs: classify
    if: needs.classify.outputs.derived_release_commit != 'true' && needs.classify.outputs.promotion_pr != 'true'
    uses: ./.github/workflows/python-correctness.yml
    with:
      path: tests/fixtures/python/fail-lint
      expect: lint

  python-fail-format:
    needs: classify
    if: needs.classify.outputs.derived_release_commit != 'true' && needs.classify.outputs.promotion_pr != 'true'
    uses: ./.github/workflows/python-correctness.yml
    with:
      path: tests/fixtures/python/fail-format
      expect: format

  python-fail-types:
    needs: classify
    if: needs.classify.outputs.derived_release_commit != 'true' && needs.classify.outputs.promotion_pr != 'true'
    uses: ./.github/workflows/python-correctness.yml
    with:
      path: tests/fixtures/python/fail-types
      expect: types

  python-fail-tests:
    needs: classify
    if: needs.classify.outputs.derived_release_commit != 'true' && needs.classify.outputs.promotion_pr != 'true'
    uses: ./.github/workflows/python-correctness.yml
    with:
      path: tests/fixtures/python/fail-tests
      expect: tests

  # bfh-check, the local command, against the same fixtures: each failing
  # fixture's summary names its own check, so a local run reports what CI does.
  bfh-check:
    needs: classify
    if: needs.classify.outputs.derived_release_commit != 'true' && needs.classify.outputs.promotion_pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check each fixture's summary
        run: |
          mismatches=0
          expect() {
            local fixture=$1 checker=$2 want=$3 out
            out=$(uvx -q --from ./.github/tools/python bfh-check \
              --path "tests/fixtures/python/$fixture" --type-checker "$checker" 2>&1) || true
            got=$(sed -n '/^== summary$/,$p' <<< "$out" | grep -v '^== summary$' | tr '\n' ' ')
            if [ "$got" = "$want" ]; then
              echo "ok       $fixture ($checker)"
            else
              echo "mismatch $fixture ($checker): got '$got', want '$want'"
              mismatches=$((mismatches + 1))
            fi
          }
          pass="lint: passed format: passed types: passed tests: passed "
          expect pass pyright "$pass"
          expect pass mypy "$pass"
          expect fail-lint pyright "lint: failed format: passed types: passed tests: passed "
          expect fail-format pyright "lint: passed format: failed types: passed tests: passed "
          expect fail-types pyright "lint: passed format: passed types: failed tests: passed "
          expect fail-tests pyright "lint: passed format: passed types: passed tests: failed "
          [ "$mismatches" -eq 0 ]

  # Self-test of flutter-correctness.yml against tests/fixtures/flutter/, the
  # same way: each failing fixture breaks one check and `expect` names it.
  # The passing call lists two packages, one Dart and one Flutter, each on its
  # pinned SDK, its floor and its downgrade leg. The Flutter package's .fvmrc
  # wins over sdk-version; the failing fixtures carry a .fvmrc too, so their
  # Dart runs from that Flutter release. The floor fixture's info fails
  # analysis on the pinned SDK only, because the floor leg does not treat
  # infos as fatal. The downgrade fixture's lower bound admits a dependency
  # release without an API it uses, so it fails analysis on the downgrade
  # leg only.
  flutter-pass:
    needs: classify
    if: needs.classify.outputs.derived_release_commit != 'true' && needs.classify.outputs.promotion_pr != 'true'
    uses: ./.github/workflows/flutter-correctness.yml
    with:
      packages: |
        tests/fixtures/flutter/dart-pass
        tests/fixtures/flutter/flutter-pass
      sdk-version: 3.14.0
      floor: true
      downgrade: true

  flutter-floor:
    needs: classify
    if: needs.classify.outputs.derived_release_commit != 'true' && needs.classify.outputs.promotion_pr != 'true'
    uses: ./.github/workflows/flutter-correctness.yml
    with:
      packages: tests/fixtures/flutter/floor
      sdk-version: 3.14.0
      floor: true
      expect: analyze

  flutter-downgrade:
    needs: classify
    if: needs.classify.outputs.derived_release_commit != 'true' && needs.classify.outputs.promotion_pr != 'true'
    uses: ./.github/workflows/flutter-correctness.yml
    with:
      packages: tests/fixtures/flutter/downgrade
      sdk-version: 3.14.0
      downgrade: true
      expect-downgrade: analyze

  flutter-fail-deps:
    needs: classify
    if: needs.classify.outputs.derived_release_commit != 'true' && needs.classify.outputs.promotion_pr != 'true'
    uses: ./.github/workflows/flutter-correctness.yml
    with:
      packages: tests/fixtures/flutter/fail-deps
      expect: deps

  flutter-fail-analyze:
    needs: classify
    if: needs.classify.outputs.derived_release_commit != 'true' && needs.classify.outputs.promotion_pr != 'true'
    uses: ./.github/workflows/flutter-correctness.yml
    with:
      packages: tests/fixtures/flutter/fail-analyze
      expect: analyze

  flutter-fail-format:
    needs: classify
    if: needs.classify.outputs.derived_release_commit != 'true' && needs.classify.outputs.promotion_pr != 'true'
    uses: ./.github/workflows/flutter-correctness.yml
    with:
      packages: tests/fixtures/flutter/fail-format
      expect: format

  flutter-fail-tests:
    needs: classify
    if: needs.classify.outputs.derived_release_commit != 'true' && needs.classify.outputs.promotion_pr != 'true'
    uses: ./.github/workflows/flutter-correctness.yml
    with:
      packages: tests/fixtures/flutter/fail-tests
      expect: tests

  # Summary jobs carry the required check names. Each runs whatever its
  # dependencies' outcome, because GitHub counts a skipped required check as
  # passing. classify is a dependency too: if it fails, the class jobs skip.
  governance:
    name: quality / governance
    needs: [classify, governance-lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a governance job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          exit 1

  # Not a required check yet (§spec:supply-chain).
  security:
    name: quality / security
    needs: [classify, dependabot-config-call, dependabot-config-fixtures, pin-shape-fixtures]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a security job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          exit 1

  correctness:
    name: quality / correctness
    needs:
      - classify
      - actionlint
      - python-pass
      - python-pass-mypy
      - python-fail-lint
      - python-fail-format
      - python-fail-types
      - python-fail-tests
      - flutter-pass
      - flutter-floor
      - flutter-downgrade
      - flutter-fail-deps
      - flutter-fail-analyze
      - flutter-fail-format
      - flutter-fail-tests
      - bfh-check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a correctness job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          exit 1
