version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope

  # ruff, pyright and mypy for python-correctness.yml. A bump lands here once,
  # gated by the Python self-test, and adopters take it with their next SHA
  # bump. One group, so the tools move together and the self-test runs once.
  - package-ecosystem: "uv"
    directory: "/.github/tools/python"
    schedule:
      interval: "weekly"
    groups:
      python-tools:
        patterns: ["*"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
