# Tool versions python-correctness.yml installs. The workflow reads these pins
# from its own commit, so a caller always gets the versions its pinned SHA was
# tested with, and bfh-check, the local command packaged here, installs them,
# so a local run agrees with CI. Dependabot (uv, /.github/tools/python)
# proposes bumps.
[project]
name = "python-correctness-tools"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "ruff==0.17.4",
    "pyright==1.1.414",
    "mypy==2.4.1",
]

[project.scripts]
bfh-check = "bfh_check:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["bfh_check.py"]
