name: flutter-correctness

# Correctness checks for Dart and Flutter packages (§spec:flutter-correctness):
# dependency resolution, the analyzer with infos fatal, the format check and
# the tests, one job per package. An adopter calls this workflow and makes its
# `quality / correctness` summary job depend on the call.
#
# Each job runs the flutter-check action from this workflow's own commit, so
# the workflow and the action cannot diverge in what they check. The SDK pin
# stays with the project: its .fvmrc, or the sdk-version input.
on:
  workflow_call:
    inputs:
      packages:
        description: >-
          Package directories relative to the repository root, separated by
          whitespace or newlines. Defaults to the root.
        type: string
        default: .
      sdk-version:
        description: >-
          SDK release for a package without a .fvmrc: a Flutter release for a
          Flutter package, a Dart release otherwise. A .fvmrc wins.
        type: string
        default: ""
      expect:
        description: >-
          Self-test only. pass, or the one check expected to fail: deps,
          analyze, format or tests. Each job passes when every check matches.
        type: string
        default: pass

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - name: List the packages
        id: plan
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          packages=$(jq -nc --arg packages "$PACKAGES" \
            '[$packages | splits("\\s+") | select(length > 0)] | if length == 0 then ["."] else . end')
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  check:
    needs: plan
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The action lives beside this workflow, so run it from the commit the
      # caller pinned. job.workflow_* names that commit; github.sha would name
      # the caller's. Fail rather than fall back to another version.
      - name: Resolve this workflow's commit
        id: self
        env:
          WF_REPO: ${{ job.workflow_repository }}
          WF_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WF_REPO" ] || [ -z "$WF_SHA" ]; then
            echo "::error::job.workflow_repository / job.workflow_sha are unavailable; cannot fetch the flutter-check action"
            exit 1
          fi
          echo "repository=$WF_REPO" >> "$GITHUB_OUTPUT"
          echo "sha=$WF_SHA" >> "$GITHUB_OUTPUT"

      # A local action must sit in the workspace. The directory is hidden and
      # holds no Dart, so the analyzer and formatter pass over it.
      - name: Check out the flutter-check action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.self.outputs.repository }}
          ref: ${{ steps.self.outputs.sha }}
          path: .flutter-correctness
          sparse-checkout: .github/actions/flutter-check
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: ./.flutter-correctness/.github/actions/flutter-check
        with:
          path: ${{ matrix.package }}
          sdk-version: ${{ inputs.sdk-version }}
          expect: ${{ inputs.expect }}
